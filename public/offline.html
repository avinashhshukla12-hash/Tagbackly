<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <title>Offline — TAGBACKLY</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #F8FAFC;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 18px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
        margin: 0 0 24px;
      }
      button {
        background: #2563EB;
        color: #FFFFFF;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">TAGBACKLY</div>
      <h1>You are currently offline</h1>
      <p>
        Please reconnect to the internet to load recovery tags, update item statuses, or send
        messages. Private chats and account credentials are never stored in offline cache.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
